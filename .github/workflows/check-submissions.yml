name: Auto Check Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'   # Runs 19:00 UTC = 00:00 AM PKT (UTC+5)

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas requests
      - name: Run submission checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add submissions.csv
          git commit -m "Auto update submission status (with deadline check)" || exit 0
          git push
